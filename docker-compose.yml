services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - lavalink
      - postgres
      - redis
    environment:
      LAVALINK_HOST: lavalink
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://quantum:quantum@postgres:5432/quantum_jukebox}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: quantum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantum_jukebox
      POSTGRES_USER: quantum
      POSTGRES_PASSWORD: quantum
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: quantum-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    container_name: quantum-lavalink
    restart: unless-stopped
    env_file:
      - .env
    environment:
      _JAVA_OPTIONS: "-Xmx1G"
      SERVER_PORT: "2333"
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YOUTUBE_OAUTH_ENABLED: ${YOUTUBE_OAUTH_ENABLED:-false}
      YOUTUBE_OAUTH_REFRESH_TOKEN: ${YOUTUBE_OAUTH_REFRESH_TOKEN:-}
      YOUTUBE_OAUTH_SKIP_INITIALIZATION: ${YOUTUBE_OAUTH_SKIP_INITIALIZATION:-false}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge


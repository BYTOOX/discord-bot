server:
  port: 2333

lavalink:
  server:
    password: ${LAVALINK_SERVER_PASSWORD:youshallnotpass}
    sources:
      youtube: false
      soundcloud: false
      bandcamp: false
      twitch: false
      vimeo: false
      http: true
      local: false
    bufferDurationMs: 400
    trackStuckThresholdMs: 30000
    youtubePlaylistLoadLimit: 101
    playerUpdateInterval: 5
    youtubeSearchEnabled: false
    soundcloudSearchEnabled: false
  plugins:
    # Pinned upstream fix for TV OAuth playback: youtube-source PR #233.
    - dependency: "dev.lavalink.youtube:youtube-plugin:b33460b38ad13b5cd07da75e46444397cf0ea2df"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
      repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # TV uses the existing OAuth credentials for audio playback.
    clients:
      - MUSIC
      - TV
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    remoteCipher:
      url: "${YOUTUBE_REMOTE_CIPHER_URL:https://cipher.kikkia.dev/}"
      userAgent: "${YOUTUBE_REMOTE_CIPHER_USER_AGENT:quantum-jukebox}"
    oauth:
      enabled: ${YOUTUBE_OAUTH_ENABLED:false}
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: ${YOUTUBE_OAUTH_SKIP_INITIALIZATION:false}
    clientOptions:
      WEB:
        playback: false
      MUSIC:
        playback: false
  lavasrc:
    providers: [] # Mirroring YouTube volontairement desactive. Configure une source directe (ex: Deezer) pour rendre Spotify lisible.
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      countryCode: "US"
      playlistLoadLimit: 101
      albumLoadLimit: 101
    # Spotify est une source "mirror" dans LavaSrc.
    # Sans provider direct non-YouTube (ex: dzisrc / dzsearch), les liens Spotify echoueront explicitement.

logging:
  level:
    root: INFO
    lavalink: INFO

